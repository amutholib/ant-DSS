<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery UI Table Grid Example</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <table id="grid">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John Doe</td>
                <td>30</td>
                <td>New York</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td>25</td>
                <td>Los Angeles</td>
            </tr>
            <tr>
                <td>Michael Johnson</td>
                <td>35</td>
                <td>Chicago</td>
            </tr>
        </tbody>
    </table>

    <div id="pager"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.tablesorter@2.31.3/dist/js/jquery.tablesorter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.tablesorter@2.31.3/dist/js/jquery.tablesorter.widgets.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#grid").tablesorter({
                theme: 'default',
                widgets: ['zebra', 'pager'],
                widgetOptions: {
                    pager_output: '{startRow} to {endRow} of {totalRows} rows',
                    pager_removeRows: false,
                    pager_size: 5
                }
            });
        });
    </script>
</body>
</html>
