        <style>
            .ui-autocomplete {
                max-height: 200px;
                max-width: auto;
                overflow-y: auto;
                overflow-x: hidden;
                padding-right: 20px;
                z-index: 1051; /* Ensure it appears above other elements */
                list-style-type: none; /* Remove list markers */
                padding-left: 0; /* Remove default padding */
                border: 1px solid #ddd;
            }
            .ui-menu-item {
                padding: 10px;
                
                background-color: #fff;
            }
            .ui-menu-item:hover {
                background-color: #f8f9fa;
            }
            .autocomplete-item {
                display: flex;
                align-items: center;
            }
            .autocomplete-icon {
                margin-right: 10px;
            }
            .autocomplete-text {
                font-weight: bold;
            }
